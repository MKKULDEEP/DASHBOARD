<!DOCTYPE html>
<html>

<head>
    <title>Post Office Target Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <h1>Post Office Target Monitoring System</h1>

    <label>Employee Name</label>
    <input type="text" id="name" placeholder="Employee Name">

    <label>Target</label>
    <input type="number" id="target" placeholder="Target">

    <label>Achievement</label>
    <input type="number" id="achievement" placeholder="Achievement">

    <button onclick="addEmployee()">Add Employee</button>

    <h2>Employee Details</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Target</th>
                <th>Achievement</th>
                <th>%</th>
            </tr>
        </thead>

        <tbody id="employeeTable">
        </tbody>

    </table>

    <h2>Total</h2>

    <div id="totalResult">
        Total Target: 0<br>
        Total Achievement: 0<br>
        Overall Achievement: 0%
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
